services:
  deepseek-v4-flash:
    image: ${RECIPE_IMAGE:-ghcr.io/tpurtell/ds4-mia-exl3-k2-1spark:latest}
    pull_policy: ${PULL_POLICY:-missing}
    restart: unless-stopped
    network_mode: host
    ipc: host
    shm_size: 64gb
    gpus: all
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:$${VLLM_PORT:-8888}/health >/dev/null"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30m
    devices:
      - /dev/infiniband:/dev/infiniband
    ulimits:
      memlock: -1
      nofile: 1048576
      stack: 67108864
    environment:
      CUDA_VISIBLE_DEVICES: ${GPUS:-0}
      HF_TOKEN: ${HF_TOKEN:-}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-1}
      HF_HUB_DISABLE_XET: ${HF_HUB_DISABLE_XET:-1}
      TRANSFORMERS_OFFLINE: ${TRANSFORMERS_OFFLINE:-1}
      VLLM_CACHE_ROOT: /cache/huggingface/vllm-cache
      MODEL_KIND: ${MODEL_KIND:-k2}
      MODEL_REPO: ${MODEL_REPO:-}
      MODEL_REVISION: ${MODEL_REVISION:-}
      DSPARK_ENCODING_FILE: ${DSPARK_ENCODING_FILE:-}
      HF_HOME: /cache/huggingface
      SERVED_MODEL_NAME: ${SERVED_MODEL_NAME:-}
      TP_SIZE: ${TP_SIZE:-1}
      NNODES: 1
      CUTE_DSL_ARCH: sm_121a
      VLLM_ALLOW_LONG_MAX_MODEL_LEN: 1
      VLLM_SPARSE_INDEXER_MAX_LOGITS_MB: ${VLLM_SPARSE_INDEXER_MAX_LOGITS_MB:-256}
      VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: 0
      VLLM_USE_B12X_MOE: 1
      VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM: ${VLLM_B12X_W4A16_FORCE_BLOCKS_PER_SM:-0}
      VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M: ${VLLM_B12X_W4A16_FORCE_BLOCKS_MAX_M:-16}
      NCCL_NET: ${NCCL_NET:-IB}
      NCCL_DEBUG: ${NCCL_DEBUG:-WARN}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-1000000}
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-6}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-8192}
      LONG_PREFILL_TOKEN_THRESHOLD: ${LONG_PREFILL_TOKEN_THRESHOLD:-1024}
      MAX_CUDAGRAPH_CAPTURE_SIZE: ${MAX_CUDAGRAPH_CAPTURE_SIZE:-}
      CUDAGRAPH_CAPTURE_SIZES: ${CUDAGRAPH_CAPTURE_SIZES:-}
      GPU_MEMORY_UTILIZATION: ${GPU_MEMORY_UTILIZATION:-0.85}
      KV_CACHE_DTYPE: ${KV_CACHE_DTYPE:-nvfp4_ds_mla}
      PREFIX_CACHE: ${PREFIX_CACHE:-1}
      DSPARK_TOKENS: ${DSPARK_TOKENS:-}
      LIMIT_MM_PER_PROMPT: ${LIMIT_MM_PER_PROMPT:-image=8}
      DRAFT_SAMPLE_METHOD: ${DRAFT_SAMPLE_METHOD:-probabilistic}
      DEFAULT_THINKING: ${DEFAULT_THINKING:-max}
      DSPARK_MAX_INFLIGHT_PREFILLS: ${DSPARK_MAX_INFLIGHT_PREFILLS:-2}
      DSPARK_ISSUE43_SCHED_DIAG: ${DSPARK_ISSUE43_SCHED_DIAG:-0}
      VLLM_PREFIX_CACHE_RETENTION_INTERVAL: ${VLLM_PREFIX_CACHE_RETENTION_INTERVAL:-4096}
      DSPARK_ENABLE_ISSUE31_GPU_HOTFIX: ${DSPARK_ENABLE_ISSUE31_GPU_HOTFIX:-0}
      DSPARK_ENABLE_ASSISTANT_FINAL_HOTFIX: ${DSPARK_ENABLE_ASSISTANT_FINAL_HOTFIX:-0}
      DSPARK_ENABLE_ISSUE136_XGRAMMAR_HOTFIX: ${DSPARK_ENABLE_ISSUE136_XGRAMMAR_HOTFIX:-1}
      DSPARK_SUPPRESS_STOPS_IN_REASONING: ${DSPARK_SUPPRESS_STOPS_IN_REASONING:-1}
      VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: ${VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS:-1800}
      TILELANG_CACHE_DIR: ${TILELANG_CACHE_DIR:-/cache/huggingface/tilelang-cache}
      TRITON_CACHE_DIR: ${TRITON_CACHE_DIR:-/cache/huggingface/triton-cache}
      B12X_COMPILE_CACHE_DIR: ${B12X_COMPILE_CACHE_DIR:-/cache/huggingface/b12x-compile-cache}
      DISTRIBUTED_EXECUTOR_BACKEND: ${DISTRIBUTED_EXECUTOR_BACKEND:-}
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      DSPARK_API_KEYS: ${DSPARK_API_KEYS:-}
    volumes:
      - ${HF_CACHE:-${HOME}/.cache/huggingface}:/cache/huggingface
